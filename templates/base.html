{% load static %}

<!DOCTYPE html>
<html>
<title>Django Learnings</title>
<link rel="icon" type="image/svg+xml" href="https://cdn.simpleicons.org/django/092E20">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="{% static 'css/cards.css' %}">

<style>
    body {
        background-color: #555; /* Light grey background */
    }

    .key {
        color: #00d7ff; /* Light blue */
    }
    
    
    .value {
        color: #ff7a00; /* Orange */
    }
    
    .card-link {
        text-decoration: none; /* Remove underline from the link */
        color: inherit; /* Inherit text color from the parent */
        display: block; /* Ensure the entire card is clickable */
    }

    .w3-monospace {
        font-family: 'Courier New', Courier, monospace;
    }

    button {
        background-color: teal;
        color: white;
        padding: 3px 7px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-bottom:5px;
    }
    
    button:hover {
        background-color: darkcyan;
    }
    
</style>

<body>
    <div class="w3-content">
        <div class="w3-panel w3-border w3-center   w3-round-large key w3-large" style="margin-top:20px">
            <p>Each belows card Represents a 
                <label class="w3-text-green"><strong>[Comprehensive Django Learnings]<strong><label>
                <br><button class="w3-small "  onclick="location.href='{% url 'hierarchy' %}'" >👦 Check Code Hierarchy Best Practices 👦</button >
            </p>
            
        </div>
    </div>

    {% include 'home/home.html' %}
    <br>
    <div class="w3-content">
        <div class="w3-panel  w3-center w3-text-white " >
            <p>Copyright © 2024 Chandra Mohan Sah. All Rights Reserved.</p>
        </div>
    </div>

</body>
</html>
